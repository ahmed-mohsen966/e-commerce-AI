<div class="mx-auto max-w-sm">
  <app-card title="Create an account">
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="firstName" class="block text-sm font-medium text-gray-700">First name</label>
          <input
            id="firstName"
            type="text"
            formControlName="firstName"
            class="mt-1 block w-full rounded-md border-0 px-3 py-2 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600"
          />
        </div>
        <div>
          <label for="lastName" class="block text-sm font-medium text-gray-700">Last name</label>
          <input
            id="lastName"
            type="text"
            formControlName="lastName"
            class="mt-1 block w-full rounded-md border-0 px-3 py-2 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600"
          />
        </div>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="mt-1 block w-full rounded-md border-0 px-3 py-2 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600"
        />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <p class="mt-1 text-sm text-red-600">A valid email is required.</p>
        }
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="mt-1 block w-full rounded-md border-0 px-3 py-2 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <p class="mt-1 text-sm text-red-600">Password must be at least 6 characters.</p>
        }
      </div>

      <app-button type="submit" [loading]="submitting()" class="w-full">Register</app-button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      Already have an account?
      <a routerLink="/auth/login" class="font-medium text-indigo-600 hover:text-indigo-500">Log in</a>
    </p>
  </app-card>
</div>
