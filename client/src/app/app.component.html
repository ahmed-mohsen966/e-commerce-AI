<div class="flex min-h-screen flex-col">
  <header class="border-b border-gray-200 bg-white">
    <nav class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3">
      <div class="flex items-center gap-6">
        <a routerLink="/products" class="text-lg font-bold text-indigo-600">ECommerce</a>
        <a
          routerLink="/products"
          routerLinkActive="text-indigo-600"
          class="text-sm font-medium text-gray-700 hover:text-indigo-600"
        >
          Products
        </a>
        @if (authService.isAuthenticated()) {
          <a
            routerLink="/orders"
            routerLinkActive="text-indigo-600"
            class="text-sm font-medium text-gray-700 hover:text-indigo-600"
          >
            My Orders
          </a>
        }
        @if (authService.hasRole('Admin')) {
          <a
            routerLink="/admin"
            routerLinkActive="text-indigo-600"
            class="text-sm font-medium text-gray-700 hover:text-indigo-600"
          >
            Admin
          </a>
        }
      </div>

      <div class="flex items-center gap-4">
        <a routerLink="/cart" class="relative text-sm font-medium text-gray-700 hover:text-indigo-600">
          Cart
          @if (cartService.itemCount() > 0) {
            <span
              class="absolute -right-3 -top-2 inline-flex h-5 w-5 items-center justify-center rounded-full bg-indigo-600 text-xs font-semibold text-white"
            >
              {{ cartService.itemCount() }}
            </span>
          }
        </a>

        @if (authService.isAuthenticated()) {
          <span class="text-sm text-gray-500">{{ authService.currentUser()?.email }}</span>
          <button
            type="button"
            class="text-sm font-medium text-gray-700 hover:text-indigo-600"
            (click)="logout()"
          >
            Log out
          </button>
        } @else {
          <a routerLink="/auth/login" class="text-sm font-medium text-gray-700 hover:text-indigo-600">Log in</a>
          <a routerLink="/auth/register" class="text-sm font-medium text-gray-700 hover:text-indigo-600">
            Register
          </a>
        }
      </div>
    </nav>
  </header>

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6">
    <router-outlet></router-outlet>
  </main>

  <app-toast-host></app-toast-host>
</div>
